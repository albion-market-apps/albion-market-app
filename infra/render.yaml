# Render Blueprint — cria o serviço `albion-api` (web, com healthcheck) a
# partir do Dockerfile já usado no Compose local. Valores com `sync: false`
# precisam ser preenchidos no dashboard do Render (nunca commitados aqui) —
# ver docs/DEPLOY_FREE_TIERS.md.
#
# Uso: Render → New → Blueprint → aponta pro repo → ele lê este arquivo.
#
# Sem serviço `worker` aqui: **testado contra o Render real no turno 10** —
# "Background Worker" não está disponível no plano free ("service type is
# not available for this plan"). A coleta de preços roda em processo dentro
# da própria API (`app/services/collector.py` + loop no lifespan de
# `app/main.py`), não como processo separado — ver changelog turno 11.
# `infra/worker.Dockerfile` e `worker/` continuam existindo só para quem
# rodar via Docker Compose local ou subir pra um plano pago no futuro.

services:
  - type: web
    name: albion-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon — ver env/.env.example.prod
      - key: REDIS_URL
        sync: false # Upstash — ver env/.env.example.prod
      - key: TENANT_DEFAULT_ID
        sync: false # gerar uma vez, nunca trocar depois do primeiro seed
      - key: API_RATE_LIMIT
        value: "60"
      - key: ALBION_BASE_URL
        value: https://www.albion-online-data.com/api/v2/stats
      - key: POLL_INTERVAL_SECONDS
        value: "300"
      - key: SENTRY_DSN
        sync: false
