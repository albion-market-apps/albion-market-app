[tool.poetry]
name = "albion-worker"
version = "0.1.0"
description = "Worker coletor de preços do mercado de Albion Online"
authors = ["Albion Market Tracker contributors"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.27.2,<0.29.0"
redis = "^5.0.8"
sqlalchemy = "^2.0.35"
psycopg = { extras = ["binary"], version = "^3.2.2" }
pydantic-settings = "^2.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.6.9"
mypy = "^1.11.2"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
