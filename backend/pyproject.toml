[tool.poetry]
name = "albion-backend"
version = "0.1.0"
description = "API do rastreador de preços do mercado de Albion Online"
authors = ["Albion Market Tracker contributors"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.6" }
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
psycopg = { extras = ["binary"], version = "^3.2.2" }
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
httpx = ">=0.27.2,<0.29.0"
redis = "^5.0.8"
prometheus-fastapi-instrumentator = "^7.0.0"
python-json-logger = "^2.0.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.6.9"
mypy = "^1.11.2"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI usa Depends(...)/Query(...) como valor default por padrão —
# não é o "mutable default argument" que a regra tenta evitar.
"app/api/routes/*.py" = ["B008"]
"app/db/rls.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
